    <rect x="70" y="8" width="50" height="20" rx="2" fill="#e8dfb0" opacity=".78" transform="rotate(4 95 18)" stroke="#1f1a17" stroke-width="2"/>
    <ellipse cx="99" cy="25" rx="11" ry="10" fill="#b3261e" stroke="#1f1a17" stroke-width="4"/>
    <circle cx="95" cy="21" r="3.5" fill="#f08a7e"/>
