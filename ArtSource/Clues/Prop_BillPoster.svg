    <!-- header -->
    <rect x="40" y="38" width="108" height="11" rx="2" fill="#2b2622"/>
    <rect x="52" y="56" width="84" height="10" rx="2" fill="#b3261e"/>
    <line x1="36" y1="76" x2="152" y2="76" stroke="#2b2622" stroke-width="2.5"/>
    <!-- line items -->
    <g stroke="#2b2622" stroke-width="3.4" stroke-linecap="round" opacity=".82">
      <line x1="40" y1="92" x2="92" y2="92"/><line x1="122" y1="92" x2="148" y2="92"/>
      <line x1="40" y1="106" x2="86" y2="106"/><line x1="122" y1="106" x2="148" y2="106"/>
      <line x1="40" y1="120" x2="96" y2="120"/><line x1="122" y1="120" x2="148" y2="120"/>
      <line x1="40" y1="134" x2="80" y2="134"/><line x1="122" y1="134" x2="148" y2="134"/>
    </g>
    <line x1="36" y1="148" x2="152" y2="148" stroke="#2b2622" stroke-width="2.5"/>
    <rect x="40" y="156" width="40" height="9" rx="2" fill="#2b2622"/>
    <rect x="114" y="156" width="34" height="9" rx="2" fill="#2b2622"/>
    <!-- handwritten red note and the circled 6 -->
    <g stroke="#c0392b" stroke-linecap="round" fill="none">
      <path d="M40 186 q6 -6 12 0 t12 0 t12 0" stroke-width="2.6"/>
      <line x1="40" y1="198" x2="48" y2="198" stroke-width="2.6"/><line x1="54" y1="198" x2="62" y2="198" stroke-width="2.6"/><line x1="68" y1="198" x2="76" y2="198" stroke-width="2.6"/>
      <circle cx="130" cy="186" r="17" stroke-width="4"/>
      <path d="M135 175 C122 175 121 196 130 197 C139 197 139 184 128 185" stroke-width="3.6"/>
