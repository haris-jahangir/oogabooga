<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 250" width="190" height="250">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g transform="rotate(-3 95 125)">
